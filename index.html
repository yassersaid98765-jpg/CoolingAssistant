<!-- قسم الحاسبة المطورة -->
<section class="card">
    <h2>🧮 حاسبة التحميم الذكية</h2>
    
    <label>نوع الغاز:</label>
    <select id="gasType" onchange="updatePressureUnits()">
        <option value="R410a">R410a (المكيفات الحديثة)</option>
        <option value="R32">R32 (المكيفات الجديدة)</option>
        <option value="R22">R22 (القديم)</option>
    </select>

    <label>ضغط السحب (Suction Pressure):</label>
    <div style="display: flex; gap: 10px;">
        <input type="number" id="pressureValue" placeholder="أدخل الضغط" style="flex: 2;">
        <select id="pressureUnit" style="flex: 1;">
            <option value="bar">Bar</option>
            <option value="psi">PSI</option>
        </select>
    </div>

    <label>درجة حرارة أنبوب السحب الفعلية (°C):</label>
    <input type="number" id="suctionTemp" placeholder="مثال: 12">
    
    <button onclick="calculateSuperheatSmart()">احسب التشخيص</button>
    <div id="calcResult" class="result-box"></div>
</section>
